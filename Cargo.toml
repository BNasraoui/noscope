[package]
name = "noscope"
version = "0.1.0"
edition = "2021"
description = "Subprocess credential lifecycle manager"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
secrecy = "0.10"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "signal", "time", "sync", "io-util"] }
shlex = "1"
signal-hook = "0.3"
# Prerelease: git dependency until provenance publishes to crates.io.
# Pinned to the commit the graph tooling was built from.
provenance-macros = { git = "https://github.com/quality-sh/provenance.git", rev = "49ed0162e9e3fea46332d5f769bac17f863ff348" }
# Authoring-only. The `provenance-spec` feature keeps the SDK and its store
# dependencies out of the shipped binary; only the declaration bin and its
# test need them.
provenance-sdk = { git = "https://github.com/quality-sh/provenance.git", rev = "49ed0162e9e3fea46332d5f769bac17f863ff348", optional = true }

[features]
provenance-spec = ["dep:provenance-sdk"]

[[bin]]
name = "noscope"
path = "src/main.rs"

# Materializes the requirements-as-code declaration as a typed
# desired-state document for `provenance sdk plan` and `... apply`.
[[bin]]
name = "noscope-provenance-spec"
path = "src/bin/provenance_spec.rs"
required-features = ["provenance-spec"]

[dev-dependencies]
static_assertions = "1.1"
serde = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
tokio = { version = "1", features = ["macros"] }
# Path type the Provenance store API takes; used by the provenance-spec test.
camino = "1.1"

[[bench]]
name = "redaction"
harness = false
