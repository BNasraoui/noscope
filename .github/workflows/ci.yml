name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

  provenance:
    name: Provenance gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install provenance CLI (pinned)
        run: >
          cargo install provenance-cli
          --git https://github.com/quality-sh/provenance.git
          --rev 49ed0162e9e3fea46332d5f769bac17f863ff348
          --locked

      # The Rust declaration is the maintainable source for the Requirements.
      # A plan that reports anything but "unchanged" means the declaration and
      # the committed graph have drifted apart.
      - name: Requirements-as-code is in sync
        run: |
          cargo run --quiet --features provenance-spec --bin noscope-provenance-spec > document.json
          provenance sdk plan --repo . --quiet < document.json > plan.json
          python3 - plan.json <<'PY'
          import json, sys

          plan = json.load(open(sys.argv[1]))
          busy = {
              field: plan[field]
              for field in ("created", "updated", "moved", "retired", "conflicts")
              if plan.get(field)
          }
          if busy:
              raise SystemExit(f"declaration has drifted from the graph: {busy}")
          print(f"declaration is in sync: {plan['unchanged']} unchanged")
          PY
          rm -f document.json plan.json

      - name: Graph integrity
        run: provenance check

      - name: Rule coverage (strict)
        run: provenance coverage scan --path . --validate-rules --strict

      # Report-only: a PR that adds or moves rule bindings always touches
      # its own evidence sites, so a strict staleness gate would fail every
      # such PR. The report shows reviewers which rule evidence the diff
      # touches; the coverage scan above stays the blocking gate.
      - name: Evidence staleness (report, PRs only)
        if: github.event_name == 'pull_request'
        run: provenance stale --since ${{ github.event.pull_request.base.sha }}
